  :root {
    --bg: #f6f2ec; --card: #ffffff; --ink: #2a2019; --muted: #8a7b6c; --line: #e8e0d5;
    --accent: #b5452b; --accent-soft: #f6e4dd; --green: #2e7d4f; --green-soft: #e1f1e7;
    --amber: #c98a12; --amber-soft: #fbf0d6; --red: #b5452b; --red-soft: #f6e4dd; --blue: #2c5d8f;
    --shadow: 0 10px 30px rgba(42,32,25,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17120e; --card: #221b15; --ink: #f2ebe2; --muted: #9d8f80; --line: #3a2f26;
      --accent: #e0765a; --accent-soft: #3a2420; --green: #6cc08f; --green-soft: #1f3327;
      --amber: #e3b04b; --amber-soft: #3a2f18; --red: #e0765a; --red-soft: #3a2420; --blue: #8fb6e0;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17120e; --card: #221b15; --ink: #f2ebe2; --muted: #9d8f80; --line: #3a2f26;
    --accent: #e0765a; --accent-soft: #3a2420; --green: #6cc08f; --green-soft: #1f3327;
    --amber: #e3b04b; --amber-soft: #3a2f18; --red: #e0765a; --red-soft: #3a2420; --blue: #8fb6e0;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, select, input[type=text] { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
         border-radius: 10px; padding: 8px 12px; transition: border-color .15s, background .15s, transform .05s; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(.98); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Header */
  header { padding: 18px 18px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; max-width: 820px; margin: 0 auto; }
  .brand h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand h1 span { color: var(--accent); font-weight: 500; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; max-width: 820px; margin: 12px auto 0; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
  .chip.known { background: var(--green-soft); color: var(--green); border-color: transparent; }
  .chip.unsure { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
  .chip.again { background: var(--red-soft); color: var(--red); border-color: transparent; }
  .chip.due { background: var(--accent); color: #fff; border-color: transparent; }

  /* Toolbar */
  .toolbar { max-width: 820px; margin: 0 auto; padding: 14px 18px 0; display: flex; flex-direction: column; gap: 10px; }
  .row-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; color: var(--muted); font-weight: 600; }
  .seg button:hover { color: var(--ink); }
  .seg button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #lessonSel { min-width: 170px; }
  .search { flex: 1; min-width: 160px; position: relative; }
  .search input { width: 100%; padding-left: 34px; }
  .search::before { content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; pointer-events: none; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row-actions button, .row-actions select { font-size: 13.5px; padding: 6px 11px; border-radius: 99px; }
  .spacer { flex: 1; }
  .muted-btn { color: var(--muted); }

  /* Main */
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 64px; }

  /* Flashcard */
  .deck-wrap { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 380px; cursor: pointer; transition: transform .55s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
          padding: 28px 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .back { transform: rotateY(180deg); }
  .lesson-tag { position: absolute; top: 16px; left: 18px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .word { font-size: clamp(32px, 7vw, 46px); font-weight: 750; color: var(--accent); margin: 10px 0 20px; word-break: break-word; line-height: 1.1; }
  .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .badge.m { background: #dfe9f5; color: #2c5d8f; border-color: transparent; }
  .badge.f { background: #f7dfe3; color: #9b2c4b; border-color: transparent; }
  .badge.due { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
  .fa { font-size: 28px; direction: rtl; margin: 6px 0 16px; font-family: Vazir, Tahoma, "Noto Naskh Arabic", sans-serif; line-height: 1.6; }
  .example { font-size: 17px; background: var(--bg); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; justify-content: center; max-width: 100%; }
  .hint { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted); }
  .tts { background: var(--card); border: 1px solid var(--line); border-radius: 50%; width: 40px; height: 40px; font-size: 17px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tts:hover { border-color: var(--accent); }
  .artic { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 16px; margin: 4px 0 26px; }
  .artic:empty { display: none; }
  .art-s, .art-p { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
  .art-s b, .art-p b { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-inline-end: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .exfa, .exfa2 { font-size: 15px; color: var(--muted); direction: rtl; text-align: center; margin-top: 8px; line-height: 1.7; font-family: Vazir, Tahoma, "Noto Naskh Arabic", sans-serif; }
  .exfa:empty, .exfa2:empty { display: none; }

  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .rate { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; border-radius: 14px; font-size: 15px; font-weight: 650; border: 0; }
  .rate small { font-size: 11px; font-weight: 500; opacity: .75; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .nav button { background: transparent; border-color: transparent; color: var(--muted); padding: 8px 10px; }

const VOW = "aeiouàèéìíòóùú";
const MULTI = {     // espressioni a più parole: [singolare con articolo, plurale con articolo | null]
  "articolo determinativo":["l'articolo determinativo","gli articoli determinativi"],

function startsVowel(w){ return VOW.includes(w[0].toLowerCase()); }
function startsSImp(w){ return /^(s[^aeiouàèéìíòóùú]|z|gn|ps|x|y|i[aeiouàèéìíòóùú])/i.test(w); }
function pluralMasc(w){
  const lw = w.toLowerCase();
  if (ART_EXC[lw]) return ART_EXC[lw];
  if (/[àèéìíòóùú]$/i.test(w)) return w;          // caffè, tè
  if (/[^aeiou]$/i.test(w)) return w;             // film, bar, sport
  if (/ico$/i.test(w)) return w.slice(0,-2)+"ici";
  if (/sco$/i.test(w)) return w.slice(0,-3)+"schi";
  if (/(c|g)o$/i.test(w)) return w.slice(0,-1)+"hi";
  if (/io$/i.test(w)) return w.slice(0,-1);       // figlio→figli, bacio→baci
  if (/o$/i.test(w)) return w.slice(0,-1)+"i";    // libro→libri
  if (/ga$/i.test(w)) return w.slice(0,-2)+"ghi";
  if (/ca$/i.test(w)) return w.slice(0,-2)+"chi";
  if (/[ae]$/i.test(w)) return w.slice(0,-1)+"i"; // problema→problemi, cane→cani
  return w;
}
function pluralFem(w){
  const lw = w.toLowerCase();
  if (ART_EXC[lw]) return ART_EXC[lw];
  if (/[àèéìíòóùú]$/i.test(w)) return w;          // città
  if (/[^aeiou]cia$|[^aeiou]gia$/i.test(w)) return w.slice(0,-2)+"e"; // arancia→arance, faccia→facce
  if (/[aeiou]cia$|[aeiou]gia$/i.test(w)) return w.slice(0,-1)+"e";   // farmacia→farmacie
  if (/ca$/i.test(w)) return w.slice(0,-2)+"che";
  if (/ga$/i.test(w)) return w.slice(0,-2)+"ghe";
  if (/a$/i.test(w)) return w.slice(0,-1)+"e";    // casa→case
  if (/e$/i.test(w)) return w.slice(0,-1)+"i";    // chiave→chiavi
  return w;                                       // -o abbreviazioni, -ie invariabili
}
function artInfo(it, g){
  if (!g) return null;
  const lit = it.toLowerCase();
  if (/^[A-ZÀ-Ú]/.test(it)) return null;                       // nomi propri
  if (MULTI[lit]) {
    const [s, p] = MULTI[lit];
    return {singular: s, plural: p};
  }
  if (it.includes(" ")) return null;                           // altre espressioni: nessun articolo
  if (it.includes("/")){                                       // doppia forma: commesso/a
    const m = it.match(/^(.+?)\/(a|o|e|i)$/);
    if (!m) return null;
    const mSing = m[1];
    const fSing = mSing.replace(/[oe]$/, "") + (m[2] === "o" ? "a" : m[2]);
    const pm = pluralMasc(mSing), pf = pluralFem(fSing);
    const sing = (startsVowel(mSing) ? "l'" + mSing : (startsSImp(mSing) ? "lo " : "il ") + mSing)
               + "/" + (startsVowel(fSing) ? "l'" + fSing : "la " + fSing);
    const plur = (startsVowel(pm) || startsSImp(pm) ? "gli" : "i") + "/le " + pm + "/" + pf;
    return {singular: sing, plural: plur};
  }
  if (g === "f"){
    if (/i$/i.test(it) && !ART_EXC[lit]) return null;         // mani, crisi-like plurali
    return {singular: (startsVowel(it) ? "l'" + it : "la " + it), plural: "le " + pluralFem(it)};
  }
  if (g === "m"){
    if (/i$/i.test(it) && !ART_EXC[lit]) return null;         // amici, soldi: già plurali
    const pm = pluralMasc(it);
    const sArt = startsVowel(it) ? "l'" + it : (startsSImp(it) ? "lo " + it : "il " + it);
    const pArt = (startsVowel(pm) || startsSImp(pm) ? "gli " : "i ") + pm;
    return {singular: sArt, plural: pArt};
  }
  return null;
}

function artHTML(a){
  if (!a) return "";
  if (a.forms) return a.forms.map(([l, v]) => `<span class="art-s"><b>${l}</b> ${v}</span>`).join("");
  return `<span class="art-s"><b>Sing.</b> ${a.singular}</span><span class="art-p"><b>Pl.</b> ${a.plural}</span>`;
}
function formsFor(w){
  if (w[2] === "n") return artInfo(w[0], w[3]);
  if (w[2] === "adj") return adjInfo(w[0]);
  return null;
}
/* ---------- FORME DEGLI AGGETTIVI (2 o 4 forme) ---------- */
const ADJ_INV = ["blu","rosa","viola","beige","pari","dispari","ogni","qualche","qualsiasi","qualunque","marrone"];
const ADJ_EXC = {  // [M sing, F sing, M pl, F pl]
  "buono":["buono","buona","buoni","buone"],
  "bello":["bello","bella","belli","belle"],
  "grande":["grande","grande","grandi","grandi"],
  "santo":["santo","santa","santi","sante"],
  "poco":["poco","poca","pochi","poche"]
};
function adjInfo(it){
  const lw = it.toLowerCase().trim();
  if (ADJ_INV.includes(lw) || lw.includes(" ")) return {forms: [["Sing.", it], ["Pl.", it]]};
  if (ADJ_EXC[lw]){
    const [a,b,c,d] = ADJ_EXC[lw];
    return {forms: [["M sing.", a], ["F sing.", b], ["M pl.", c], ["F pl.", d]]};
  }
  if (/o$/i.test(it)){                      // quattro forme: -o / -a / -i / -e
    const st = it.slice(0,-1);
    let mP, fP;
    if (/io$/i.test(it))      { mP = st;                 fP = st + "e"; }        // vario→vari/varie
    else if (/[aeiou](c|g)o$/i.test(it)) { mP = st + "i"; fP = st + "he".replace("he", /c o$/.test(it.slice(-2)) ? "he" : "he"); }
    else if (/(c|g)o$/i.test(it)) { mP = st + "hi";   fP = st + "he"; }        // bianco→bianchi, lungo→lunghi
    else                       { mP = st + "i";        fP = st + "e"; }
    // fix per -co/-go dopo vocale: simpatico→simpatici/simpatiche, magico→magici/magiche
    if (/[aeiou]co$/i.test(it)) { mP = st + "i"; fP = st + "he"; }
    if (/[aeiou]go$/i.test(it)) { mP = st + "i"; fP = st + "he"; }
    if (/[aeiou]co$/i.test(it) && /(c)o$/i.test(it)) { fP = st + "he"; }
    return {forms: [["M sing.", it], ["F sing.", st + "a"], ["M pl.", mP], ["F pl.", fP]]};
  }
  if (/[ea]$/i.test(it)) return {forms: [["Sing.", it], ["Pl.", it.slice(0,-1) + "i"]]};  // facile→facili, ipocrita→ipocriti
  return {forms: [["Sing.", it], ["Pl.", it]]};

/* ---------- STATE ---------- */
const POS_LABEL = {n:"Nome", v:"Verbo", adj:"Aggettivo", adv:"Avverbio", pron:"Pronome",
                   prep:"Preposizione", conj:"Congiunzione", expr:"Espressione"};
const GEN_LABEL = {m:"maschile", f:"femminile"};
let deck = [];       // array of {lesson, it, fa, pos, g, ex}
let idx = 0;
let mode = "cards";

function allCards(){
  const out = [];
  LESSONS.forEach(L => L.words.forEach(w => out.push({
    lesson: L.n, it: w[0], fa: w[1], pos: w[2], g: w[3], ex: w[4], exfa: FA_EX[L.n + "|" + w[4]] || "", art: formsFor(w)
  })));
  return out;
}

function buildDeck(){
  const sel = document.getElementById("lessonSel").value;
  const q = (document.getElementById("search") ? document.getElementById("search").value.trim().toLowerCase() : "");
  deck = allCards().filter(c => (sel === "all" || String(c.lesson) === sel) &&
    (!q || c.it.toLowerCase().includes(q) || c.fa.includes(q) || (c.ex||"").toLowerCase().includes(q)));
  idx = 0;
  if (pendingKey){
    const i = deck.findIndex(c => c.lesson + "|" + c.it === pendingKey);
    if (i >= 0) idx = i;
  }
  renderCard();
}

/* ---------- TTS ---------- */
let itVoice = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  itVoice = vs.find(v => /^it[-_]IT/i.test(v.lang)) || vs.find(v => /^it/i.test(v.lang)) || null;
}
if (window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, ev){
  if (ev) ev.stopPropagation();
  if (!window.speechSynthesis){ alert("La sintesi vocale non è disponibile in questo browser."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "it-IT";
  u.rate = 0.85;
  if (itVoice) u.voice = itVoice;
  speechSynthesis.speak(u);
}

/* ---------- CARD RENDERING ---------- */
/* ---------- Resume where you left off (per-browser, localStorage) ---------- */
let persistOn = false;
let pendingKey = null;   // card to return to after load (extra words are merged after init)
function loadState(){
  try { return JSON.parse(localStorage.getItem("a1-state") || "null"); } catch(e){ return null; }
}
function saveState(){
  if (!persistOn) return;
  try {
    const c = deck[idx];
    localStorage.setItem("a1-state", JSON.stringify({
      mode: mode,
      lesson: document.getElementById("lessonSel").value,
      q: document.getElementById("search").value,
      key: c ? c.lesson + "|" + c.it : ""
    }));
  } catch(e){}
}

function badgesHTML(c){
  let h = `<span class="badge">${POS_LABEL[c.pos] || c.pos}</span>`;
  if (c.pos === "n" && c.g) h += `<span class="badge ${c.g}">${GEN_LABEL[c.g]}</span>`;
  return h;
}

/* ---------- Bookmark (explicit, survives refresh and reopen) ---------- */
function loadBM(){
  try { return JSON.parse(localStorage.getItem("a1-bookmark") || "null"); } catch(e){ return null; }
}
function saveBM(v){
  try {
    if (v) localStorage.setItem("a1-bookmark", JSON.stringify(v));
    else localStorage.removeItem("a1-bookmark");
  } catch(e){}
}
function curKey(){ const c = deck[idx]; return c ? c.lesson + "|" + c.it : ""; }
function updateMarks(){
  const b = loadBM();
  const onMark = !!b && deck.length > 0 && b.key === curKey();
  const mb = document.getElementById("markBtn"), gb = document.getElementById("gotoBtn");
  mb.disabled = !deck.length;
  mb.textContent = onMark ? "🔖 Segnato" : "🔖 Segna";
  mb.title = onMark ? "Rimuovi segnalibro" : "Salva questa parola come segnalibro";
  gb.hidden = !b || onMark;
  if (b){ gb.textContent = "📍 " + b.label; gb.title = "Vai al segnalibro: " + b.label; }
}
function toggleMark(){
  if (!deck.length) return;
  const c = deck[idx];
  if (loadBM() && loadBM().key === curKey()) saveBM(null);
  else saveBM({ lesson: String(c.lesson), key: curKey(), label: "Lez. " + c.lesson + " · " + c.it });
  updateMarks();
}
function gotoMark(){
  const b = loadBM();
  if (!b) return;
  const sel = document.getElementById("lessonSel");
  sel.value = [...sel.options].some(o => o.value === b.lesson) ? b.lesson : "all";
  document.getElementById("search").value = "";
  if (mode !== "cards") setMode("cards");
  buildDeck();
  const i = deck.findIndex(c => c.lesson + "|" + c.it === b.key);
  if (i >= 0){ idx = i; renderCard(); }
}

function renderCard(){
  saveState();
  updateMarks();
  const card = document.getElementById("card");
  card.classList.remove("flipped");
  if (!deck.length){
    document.getElementById("itWord").textContent = "—";
    document.getElementById("badgesF").innerHTML = "";
    document.getElementById("faWord").textContent = "";
    document.getElementById("exText").textContent = "";
    document.getElementById("counter").textContent = "Nessuna parola";
    return;
  }
  const c = deck[idx];
  document.getElementById("lessonTagF").textContent = "Lezione " + c.lesson;
  document.getElementById("lessonTagB").textContent = "Lezione " + c.lesson;
  document.getElementById("itWord").textContent = c.it;
  document.getElementById("badgesF").innerHTML = badgesHTML(c);
  document.getElementById("faWord").textContent = c.fa;
  document.getElementById("exText").textContent = c.ex;
  document.getElementById("articF").innerHTML = artHTML(c.art);
  document.getElementById("exFa").textContent = c.exfa;
  document.getElementById("counter").textContent =
    `${idx + 1} / ${deck.length}`;
  const pct = ((idx + 1) / deck.length) * 100;
  document.getElementById("bar").style.width = pct + "%";
}

function flip(){ if (deck.length) document.getElementById("card").classList.toggle("flipped"); }
function next(){ if (!deck.length) return; idx = (idx + 1) % deck.length; renderCard(); }
function prev(){ if (!deck.length) return; idx = (idx - 1 + deck.length) % deck.length; renderCard(); }

function updateStats(){
  const total = allCards().length;
  document.getElementById("stats").innerHTML =
    '<span class="chip">' + total + ' parole</span>' +
    '<span class="chip">' + LESSONS.length + ' lezioni</span>';
}

/* ---------- LIST VIEW ---------- */
function renderList(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const sel = document.getElementById("lessonSel").value;
  const wrap = document.getElementById("listView");
  let html = "";
  LESSONS.forEach(L => {
    if (sel !== "all" && String(L.n) !== sel) return;
    const rows = L.words.filter(w =>
      !q || w[0].toLowerCase().includes(q) || w[1].includes(q) || w[4].toLowerCase().includes(q));
    if (!rows.length) return;
    html += `<div class="lesson-head">Lezione ${L.n} · ${rows.length} parole</div>`;
    rows.forEach(w => {

      html += `<div class="row">
        <div class="it">${w[0]} <span class="badge">${POS_LABEL[w[2]]||w[2]}</span>
          ${w[2]==="n" && w[3] ? `<span class="badge ${w[3]}">${GEN_LABEL[w[3]]}</span>` : ""}</div>
        <div class="meta"><button class="tts" title="Ascolta" onclick='speak(${JSON.stringify(w[0])}, event)'>🔊</button></div>
        <div class="fa2" dir="rtl" lang="fa">${w[1]}</div>
        <div class="ex">${w[4]} <button class="tts" style="width:30px;height:30px;font-size:13px;margin-left:6px" title="Ascolta esempio" onclick='speak(${JSON.stringify(w[4])}, event)'>🔊</button></div>
        ${formsFor(w) ? `<div class="artic-row">${artHTML(formsFor(w))}</div>` : ""}
        <div class="exfa2" dir="rtl" lang="fa">${FA_EX[L.n + "|" + w[4]] || ""}</div>
      </div>`;
    });
  });
  wrap.innerHTML = html || `<div class="empty">Nessun risultato</div>`;
}

/* ---------- MODE / CONTROLS ---------- */
function setMode(m){
  mode = m;
  saveState();
  document.getElementById("cardsView").classList.toggle("hidden", m !== "cards");
  document.getElementById("listView").classList.toggle("hidden", m !== "list");
  document.getElementById("modeCards").classList.toggle("active", m === "cards");
  document.getElementById("modeList").classList.toggle("active", m === "list");
  if (m === "list") renderList();
}

function init(){
  const sel = document.getElementById("lessonSel");
  sel.innerHTML = `<option value="all">Tutte le lezioni</option>` +
    LESSONS.map(L => `<option value="${L.n}">Lezione ${L.n} (${L.words.length})</option>`).join("");
  const SAVED = loadState();
  if (SAVED){
    if ([...sel.options].some(o => o.value === SAVED.lesson)) sel.value = SAVED.lesson;
    if (typeof SAVED.q === "string") document.getElementById("search").value = SAVED.q;
  }

  sel.addEventListener("change", () => { buildDeck(); if (mode === "list") renderList(); });
  document.getElementById("modeCards").onclick = () => setMode("cards");
  document.getElementById("modeList").onclick = () => setMode("list");
  document.getElementById("search").addEventListener("input", () => { if (mode === "list") renderList(); else buildDeck(); saveState(); });
  document.getElementById("shuffleBtn").onclick = () => {
    for (let i = deck.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    idx = 0; renderCard();
  };
  document.getElementById("ttsWord").onclick = e => speak(deck[idx].it, e);
  document.getElementById("ttsEx").onclick = e => speak(deck[idx].ex, e);
  document.getElementById("prevBtn").onclick = prev;
  document.getElementById("nextBtn").onclick = next;
  document.getElementById("markBtn").onclick = toggleMark;
  document.getElementById("gotoBtn").onclick = gotoMark;
  const cardEl = document.getElementById("card");
  // swipe the card left/right to move (mobile); a swipe does not also flip the card
  let sx = 0, sy = 0, tracking = false, swiped = false;
  cardEl.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    tracking = true; swiped = false; sx = e.clientX; sy = e.clientY;
  });
  cardEl.addEventListener("pointerup", e => {
    if (!tracking) return; tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
      swiped = true;
      if (dx < 0) next(); else prev();
    }
  });
  cardEl.addEventListener("pointercancel", () => { tracking = false; });
  cardEl.onclick = () => { if (swiped){ swiped = false; return; } flip(); };

  // drag or tap the progress bar to jump to any card
  const progEl = document.querySelector(".progress");
  let seeking = false;
  const seekAt = e => {
    if (!deck.length) return;
    const r = progEl.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const i = Math.round(f * (deck.length - 1));
    if (i !== idx){ idx = i; renderCard(); }
  };
  progEl.addEventListener("pointerdown", e => { seeking = true; progEl.setPointerCapture(e.pointerId); seekAt(e); });
  progEl.addEventListener("pointermove", e => { if (seeking) seekAt(e); });
  progEl.addEventListener("pointerup", () => { seeking = false; });
  progEl.addEventListener("pointercancel", () => { seeking = false; });

  document.addEventListener("keydown", e => {
    if (mode !== "cards" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === "s" || e.key === "S") speak(deck[idx].it);
  });

  buildDeck();
  if (SAVED && SAVED.mode === "list") setMode("list");
  updateStats();
  // extra vocabulary is merged by later scripts (each rebuilds the deck); keep the
  // saved card as target until they have run, then start saving again
  if (SAVED && SAVED.key) pendingKey = SAVED.key;
  window.addEventListener("load", () => { pendingKey = null; persistOn = true; saveState(); });
}
init();
</script>
